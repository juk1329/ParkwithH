<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ParkwithH 운영사 대시보드</title>
<style>
  :root { --bg:#12161c; --panel:#1c222b; --text:#eef1f5; --muted:#9aa4b2; --good:#78dcaa; --warn:#f2c14e; --line:#2c343f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:18px/1.4 system-ui, "Noto Sans KR", sans-serif; padding:24px; word-break:keep-all; }
  h1 { font-size:34px; margin:0 0 4px; }
  .sample { color:var(--muted); margin-bottom:20px; }
  .layout { display:grid; grid-template-columns:minmax(0,3fr) minmax(0,2fr); gap:20px; }
  @media (max-width:800px) { .layout { grid-template-columns:1fr; } }
  .zones { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px; align-content:start; }
  .zone { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .zone b { font-size:30px; display:block; }
  .zone.JUST_LEFT { border-color:var(--good); }
  .zone.LEAVING_SOON { border-color:var(--warn); }
  .state { font-size:20px; margin:6px 0; }
  .JUST_LEFT .state { color:var(--good); }
  .LEAVING_SOON .state { color:var(--warn); }
  .small { color:var(--muted); font-size:15px; }
  .log { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .log h2 { font-size:20px; margin:0 0 10px; }
  table { width:100%; border-collapse:collapse; font-size:15px; font-variant-numeric:tabular-nums; }
  td { padding:5px 8px 5px 0; border-top:1px solid var(--line); white-space:nowrap; }
  .empty { color:var(--muted); }
</style>
</head>
<body>
  <h1 id="name">주차장</h1>
  <div class="sample" id="sample"></div>
  <div class="layout">
    <div class="zones" id="zones"></div>
    <div class="log"><h2>원시 이벤트 로그</h2><table id="log"></table></div>
  </div>
<script>
const lot = "__LOT_ID__";
const zoneText = id => {
  if (id === "UNZONED") return "구역 미입력";
  const m = /^(B?)(\d)(F?)(?:-(.+))?$/.exec(id);
  if (!m) return id;
  return (m[1] ? "지하 " : "") + m[2] + "층" + (m[4] ? " " + m[4] + "구역" : "");
};
const age = ms => ms < 60000 ? "방금" : Math.round(ms / 60000) + "분 전";
const stateText = z => {
  if (z.status === "JUST_LEFT") {
    const others = z.vacancies.length - 1;
    return age(z.vacancies[0]) + " 1대 출차" + (others > 0 ? ` 외 ${others}대` : "");
  }
  if (z.status === "LEAVING_SOON") return "곧 나갈 차 있음";
  if (z.status === "FULLNESS") return "운전자 응답: " + z.fullness;
  return "소식 없음";
};
// Upper floors first, then deeper and deeper, as a floor directory reads. Unzoned reports go last.
const floorRank = id => {
  const m = /^(B?)(\d)/.exec(id);
  if (!m) return Infinity;
  return m[1] ? Number(m[2]) : -Number(m[2]);
};
const inFloorOrder = zones => zones.slice().sort((a, b) =>
  floorRank(a.zone_id) - floorRank(b.zone_id) || a.zone_id.localeCompare(b.zone_id));
const clock = ms => {
  const d = new Date(ms), two = n => String(n).padStart(2, "0");
  return `${two(d.getHours())}:${two(d.getMinutes())}:${two(d.getSeconds())}`;
};
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}
async function refresh() {
  try {
    const board = await (await fetch(`/v1/lots/${lot}/board`)).json();
    const log = await (await fetch(`/v1/lots/${lot}/events?limit=14`)).json();
    document.getElementById("name").textContent = board.name || lot;
    const capacity = board.registeredCapacity ? `등록 약 ${board.registeredCapacity.toLocaleString()}면` : "등록 면수 없음";
    document.getElementById("sample").textContent = `앱 차량 ${board.parkedAppCars}대 / ${capacity} · 앱 차량만 관측하며 잔여 대수가 아닙니다`;
    const zones = document.getElementById("zones");
    zones.replaceChildren(...inFloorOrder(board.zones).map(z => {
      const card = el("div", "zone " + z.status);
      card.append(el("b", "", zoneText(z.zone_id)), el("div", "state", stateText(z)), el("div", "small", `앱 차량 ${z.parked_app_cars}대`));
      return card;
    }));
    if (!board.zones.length) zones.replaceChildren(el("div", "empty", "아직 이벤트가 없습니다"));
    const table = document.getElementById("log");
    table.replaceChildren(...log.events.slice().reverse().map(e => {
      const row = el("tr");
      row.append(el("td", "", clock(e.occurred_at)), el("td", "", e.type), el("td", "", e.zone_id || "-"), el("td", "small", e.session_id.slice(0, 6)));
      return row;
    }));
  } catch (error) {
    document.getElementById("sample").textContent = "서버에 연결할 수 없습니다";
  }
}
refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
